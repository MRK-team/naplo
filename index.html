<!doctype html>
<html lang="hu">
<head>

<title>MRKteam</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#161616;--mut:#6b6b6b;--acc:#d11a24;--acc2:#fde8e8;--onacc:#fff;--full:#161616;--onfull:#fff;--off:#ea580c;--offbg:#ffedd5;--ok:#166534;--okbg:#dcfce7;--brand:#d11a24;--warn:#a16207;--warnbg:#fef3c7;--line:#e6e6e6;--danger:#c81e1e;--oth:#1d4ed8;--othbg:#dbeafe;--redbg:#fde8e8}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e0e;--card:#1a1a1a;--ink:#f0f0f0;--mut:#9a9a9a;--acc:#e5333d;--acc2:#3a1518;--onacc:#fff;--full:#ececec;--onfull:#111;--off:#fb923c;--offbg:#3a2210;--ok:#4ade80;--okbg:#12301d;--brand:#ff4d57;--warn:#fbbf24;--warnbg:#3a2e0b;--line:#2c2c2c;--danger:#f87171;--oth:#93c5fd;--othbg:#172554;--redbg:#3b1212}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:#000;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;z-index:5}
header .icon{background:#1c1c1c;color:#fff;border-color:#3a3a3a}
.logo{flex:1;font:italic 900 23px/1 Georgia,"Times New Roman",serif;letter-spacing:-.3px;color:#fff}
.logo small{display:block;font:italic 400 13px/1.2 "Brush Script MT","Segoe Script",cursive;color:#ef3340;margin:2px 0 0 52px;letter-spacing:0}
.ptl{font-size:20px;font-weight:800;margin:2px 0 10px}
header h1{font-size:20px;margin:0;flex:1}
main{padding:12px 16px;max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.icon{font-size:15px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.client{width:100%;text-align:left;display:block}
.client b{font-size:17px}
.sub{color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:600;font-size:14px;white-space:nowrap}
.pill.low{background:var(--warnbg);color:var(--warn)}
.pill.zero{background:var(--line);color:var(--mut)}
.pill.full{background:var(--full);color:var(--onfull)}
.big{width:100%;padding:16px;border-radius:14px;background:var(--acc);color:var(--onacc);font-size:18px;font-weight:700}
@media(prefers-color-scheme:dark){.big{color:var(--onacc)}}
.fab{position:fixed;left:16px;right:16px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;padding:14px 10px;font-weight:700;color:var(--mut)}
.tabs button.on{color:var(--brand)}
.grp{margin:16px 0 4px;color:var(--mut);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sess{width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.sess .d{font-variant-numeric:tabular-nums;font-weight:700;min-width:88px}
.sess .t{flex:1}
.sess .w{color:var(--acc);font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:16px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
@media(prefers-color-scheme:dark){.chip.on{color:var(--onacc)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:14px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btns .ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
@media(prefers-color-scheme:dark){.btns .ok{color:var(--onacc)}}
.btns .del{color:var(--danger);border-color:var(--danger);flex:0 0 auto}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
svg{width:100%;height:auto;display:block}
.day{margin:18px 0 6px;font-weight:700}

.slotrow{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px}
.slotrow .tm{font-weight:700;font-variant-numeric:tabular-nums;min-width:46px}
.slotrow .nm{flex:1;font-size:15px}
.minis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:600}
.mini.ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
@media(prefers-color-scheme:dark){.mini.ok{color:var(--onacc)}}
.sheet .card{margin-bottom:8px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.hint.oth{color:var(--oth);font-weight:600}
.icon:disabled{opacity:.3;cursor:default}
.bignum{font-size:32px;font-weight:800;margin:4px 0 6px;letter-spacing:-.5px}
.rrow{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.offbar{margin-bottom:10px}
.offb{display:flex;width:100%;text-align:left;gap:8px;align-items:center;background:var(--offbg);color:var(--off);border:1px solid var(--off);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;font-weight:600}
.offw{background:var(--offbg);color:var(--off);font-weight:600}
.cg-h.off b,.cg-h.off span{color:var(--off)}
.cg-h.off{box-shadow:inset 0 -3px 0 var(--off)}
.cg-c.off{background:var(--offbg)!important;border-color:var(--off)!important;color:var(--off)!important}
.cg-c.off .cnt{color:var(--off)!important}
.chip.oth{border-color:var(--oth)}
.chip.oth.on{background:var(--oth);border-color:var(--oth);color:#fff}
@media(prefers-color-scheme:dark){.chip.oth.on{color:#0b1a33}}
.sess.other{background:var(--othbg);border-radius:10px;padding-left:10px;padding-right:8px;margin:2px 0;border-bottom:0;box-shadow:inset 4px 0 0 var(--oth)}
.sess.other .t b{color:var(--oth)}
.stat .st i.oth{background:var(--oth)}
.sortbar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.sortbar .lbl{font-size:13px;color:var(--mut);margin-right:2px}
.sortbar .chip{padding:7px 12px;font-size:14px}
.meta{margin-top:3px}
.sbar{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:-2px}
.sbar i{display:block;width:5px;border-radius:1.5px;background:var(--line)}
.sbar i:nth-child(1){height:6px}.sbar i:nth-child(2){height:8px}.sbar i:nth-child(3){height:10px}.sbar i:nth-child(4){height:12px}.sbar i:nth-child(5){height:14px}
.sbar i.on{background:var(--acc)}
.datebtn{display:block;width:100%;text-align:left;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.dpgrid span{text-align:center;font-size:12px;opacity:.6}
.dpd{padding:9px 0;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit}
.dpd.off{opacity:.25}
:root{--pay:#6d28d9;--paybg:#ede9fe}
@media (prefers-color-scheme:dark){:root{--pay:#c4b5fd;--paybg:#2e1f55}}
.pill.pay{background:var(--paybg);color:var(--pay)}
.tag.payt{border-color:var(--pay);color:var(--pay)}
.paywarn{background:var(--paybg);color:var(--pay)}
.payrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.payrow:last-child{border-bottom:0}
.vb{margin-top:2px;font-size:10px;font-weight:800;border:1.5px solid var(--mut);border-radius:6px;padding:0 4px;line-height:13px;color:var(--ink);background:var(--card);font-style:normal}.dpd.sel{background:var(--acc);color:var(--onacc)}.dpd.tod{outline:1px solid var(--acc)}
.dphead{display:flex;align-items:center;justify-content:space-between;gap:8px}.dphead b{font-size:16px}
.stat{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.stat .sl{width:78px;flex:0 0 78px}
.stat .st{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.stat .st i{display:block;height:100%;background:var(--acc);border-radius:5px}
.stat b{min-width:22px;text-align:right}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:15px;color:var(--ink);font-weight:600}
.chk input{width:22px;height:22px;flex:0 0 22px;margin:0;padding:0}
.tag{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 8px;vertical-align:middle}
.sess.lost{background:var(--warnbg);color:var(--warn);border-radius:10px;padding-left:8px;padding-right:8px;margin:2px 0;border-bottom:0}
.cg-c .n.lost{color:var(--warn);font-weight:700}
.cg{display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr));gap:3px;align-items:stretch}
.cg-h{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;display:flex;flex-direction:column;line-height:1.3}
.cg-h b{font-size:13px;color:var(--ink)}
.cg-h.today b,.cg-h.today span{color:var(--acc)}
.cg-t{display:flex;flex-direction:column;justify-content:center;font-size:12px;line-height:1.25}
.cg-t span{font-size:10px;color:var(--mut)}
.cg-c{min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:4px 1px;text-align:center;font-size:10.5px;line-height:1.3;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cg-c .cnt{font-style:normal;font-weight:800;font-size:12px}
.cg-c .n{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-c.zero{background:var(--bg);color:var(--mut)}
.cg-c.some{background:var(--acc2)}
.cg-c.some .cnt{color:var(--ink)}
.cg-c.full{background:var(--full);color:var(--onfull);border-color:var(--full)}
.cg-c.over{background:var(--warnbg);color:var(--warn)}
.cg-c.tdy{box-shadow:inset 0 0 0 2.5px var(--acc)}
.cg-e{min-height:58px;border-radius:8px;background:var(--line);opacity:.3}
.offbar{display:flex;align-items:center;gap:8px}
.ibtn{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:1.5px solid var(--ink);font:italic 700 17px Georgia,serif;display:flex;align-items:center;justify-content:center;margin-left:auto}
.lgs{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.lg .sw{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 4px;border-radius:5px;border:1px solid var(--line);font-size:11px;font-weight:800}
.sech{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:0;font-weight:400}
.sech .car{color:var(--mut);font-size:13px;width:14px}
.grp.tg{display:flex;align-items:center;gap:6px;width:100%;text-align:left;cursor:pointer}
.wgrid{display:grid;gap:6px}
.wgrid .wh{text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.wgrid .chip{padding:8px 0;font-size:13px;text-align:center;border-radius:10px;width:100%}
.dlgopts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.dlgopts button{padding:14px;border-radius:12px;font-weight:700;border:1px solid var(--line);background:var(--card);text-align:center}
.dlgopts button.ok{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.dlgopts button.del{color:var(--danger);border-color:var(--danger)}
.wch text{font-size:10px;fill:var(--mut)}
.wch .gl{stroke:var(--line);stroke-width:1}
.wch .yl{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.wch .tip rect{fill:var(--ink)}
.wch .tip text{fill:var(--bg);font-size:11px;font-weight:700}
.wch .hit{fill:transparent;cursor:pointer}
</style>

<body>
<header id="hd"></header>
<main id="app"></main>
<div id="fabwrap"></div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div id="dlg"></div>
<div id="dp"></div>

<script>
const PACK = 10;
const VERSION = '2.3 · 2026.10.06.';
const capN = () => (db && db.cfg && db.cfg.cap) || 3;
const TAGS = ['mell','hát','bicepsz','tricepsz','váll','láb','fenék','has','core','kardió','egyéb'];
const DOW = ['Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat','Vasárnap'];
const DOWS = ['H','K','Sze','Cs','P','Szo','V'];
const KEY = 'edzo-naplo-v1';
let updRaw = null;       // frissítés előtti nyers adat (verzióváltáskor)
let db = load();
let tab = 'clients';    // 'clients' | 'cal'
let view = 'list';      // 'list' | 'settings' | client id
let ui = null;          // modal state
let revMonth = null;    // a bevétel nézet hónapja (YYYY-MM)
let payOnly = false;
let calWeek = null;     // a megjelenített hét hétfője (ISO)
let openSec = {};       // vendéglapon a lenyitott/csukott részek (megnyitáskor alapállapot)
const secOpen = (k,def) => (k in openSec) ? openSec[k] : def;
function secCard(k, title, right, body, def){
  const o = secOpen(k, def);
  return `<div class="card"><button class="sech" data-a="sec" data-k="${k}" data-def="${def?1:0}"><span class="car">${o?'▾':'▸'}</span><span class="sub grow">${title}</span>${right||''}</button>${o ? `<div style="margin-top:8px">${body}</div>` : ''}</div>`;
}

/* külső (importált) adat megtisztítása: azonosítók, dátumok, számok, címkék */
function sanitize(d){
  const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const _ID = v => String(v ?? '').replace(/[^\w-]/g,'').slice(0,40);
  const _DT = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const _NUM = v => (typeof v==='number' && isFinite(v)) ? v : null;
  const _STR = (v,n) => String(v ?? '').slice(0,n);
  const arr = k => { d[k] = Array.isArray(d[k]) ? d[k].filter(x => x && typeof x==='object') : []; };
  ['clients','slots','members','skips','extras','offs','prices'].forEach(arr);
  d.clients = d.clients.filter(c => _ID(c.id));
  d.clients.forEach(c => {
    c.id = _ID(c.id); c.name = _STR(c.name,100);
    c.type = ['pack','trial','few'].includes(c.type) ? c.type : 'pack';
    ['size','lastEnd'].forEach(k => { if(c[k]!=null){ const n = _NUM(c[k]); if(n==null) delete c[k]; else c[k] = Math.max(0,Math.min(1000,Math.round(n))); } });
    if(c.strength!=null){ const n = Math.round(_NUM(c.strength)||0); if(n>=1&&n<=5) c.strength=n; else delete c.strength; }
    c.last = !!c.last;
    c.sessions = (Array.isArray(c.sessions) ? c.sessions : []).filter(x => x && typeof x==='object' && _DT(x.date));
    c.sessions.forEach(x => {
      x.id = _ID(x.id) || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)); if(x.ref!=null) x.ref = String(x.ref).replace(/[^\w|-]/g,'').slice(0,120);
      x.tags = (Array.isArray(x.tags) ? x.tags : []).filter(t => TAGS.includes(t));
      x.weight = _NUM(x.weight); x.note = _STR(x.note,2000);
      if(x.val!=null){ x.val = _NUM(x.val); if(x.val==null) delete x.val; }
    });
  });
  d.slots = d.slots.filter(x => _ID(x.id) && /^\d{2}:\d{2}$/.test(x.time) && x.dow>=1 && x.dow<=7);
  d.slots.forEach(x => { x.id=_ID(x.id); x.dow=Math.round(x.dow); x.dur=_NUM(x.dur)||60;
    ['from','to'].forEach(k => { if(!_DT(x[k])) delete x[k]; });
    if(Array.isArray(x.no)){ x.no = x.no.filter(_DT); if(!x.no.length) delete x.no; } else delete x.no; });
  d.members = d.members.filter(x => _ID(x.id) && _ID(x.slotId) && _ID(x.clientId) && _DT(x.from) && (x.to==null || _DT(x.to)));
  d.members.forEach(x => { x.id=_ID(x.id); x.slotId=_ID(x.slotId); x.clientId=_ID(x.clientId); });
  [d.skips,d.extras].forEach((a,i) => { const k = i?'extras':'skips'; d[k] = a.filter(x => _ID(x.slotId) && _ID(x.clientId) && _DT(x.date)); d[k].forEach(x => { x.slotId=_ID(x.slotId); x.clientId=_ID(x.clientId); if(x.id!=null) x.id=_ID(x.id); }); });
  d.offs = d.offs.filter(x => _DT(x.from) && _DT(x.to));
  d.offs.forEach(x => { x.id = _ID(x.id) || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)); x.note = _STR(x.note,500);
    const TM = v => typeof v==='string' && /^\d{2}:\d{2}$/.test(v);
    if(!(TM(x.t1) && TM(x.t2) && x.t1 < x.t2)){ delete x.t1; delete x.t2; } });
  d.prices = d.prices.filter(x => _DT(x.from) && _NUM(x.pack)!=null && _NUM(x.single)!=null);
  d.cfg = (d.cfg && typeof d.cfg==='object') ? d.cfg : {};
  d.cfg = {cap: Math.max(1,Math.min(12,Math.round(_NUM(d.cfg.cap)||3))), bkEvery: Math.max(5,Math.min(500,Math.round(_NUM(d.cfg.bkEvery)||50))), bkMonday: d.cfg.bkMonday!==false};
  const METH = ['atutalas','keszpenz'];
  d.clients.forEach(c => {
    c.phone = _STR(c.phone,30).replace(/[^\d+\-()\/. ]/g,'').trim(); if(!c.phone) delete c.phone;
    if(c.anon) c.anon = true; else delete c.anon;
    c.pays = (Array.isArray(c.pays) ? c.pays : []).filter(p => p && typeof p==='object' && _DT(p.date) && Number.isInteger(p.pack) && p.pack>=0 && p.pack<1000 && METH.includes(p.method)).map(p => ({id:_ID(p.id)||rid(), pack:p.pack, date:p.date, method:p.method}));
    c.sessions.forEach(x => { if(x.paid && typeof x.paid==='object' && _DT(x.paid.date) && METH.includes(x.paid.method)) x.paid = {date:x.paid.date, method:x.paid.method}; else delete x.paid; });
  });
  const _ids = a => (Array.isArray(a) ? a : []).map(_ID).filter(x => x && d.slots.some(sl => sl.id===x));
  d.wait = (Array.isArray(d.wait) ? d.wait : []).filter(w => w && typeof w==='object' && _ID(w.clientId))
    .map(w => ({id:_ID(w.id)||rid(), clientId:_ID(w.clientId), fix:_ids(w.fix), flex:_ids(w.flex), note:_STR(w.note,300), ts:_DT(w.ts) ? w.ts : '2026-01-01'}))
    .filter(w => d.clients.some(c => c.id===w.clientId && !c.anon) && (w.fix.length || w.flex.length));

function sessionValues(c){

function planInfo(){
  const t = today(), end = addDays(addMonths(t.slice(0,7),2)+'-01',-1);

  db.clients.forEach(c => cap.set(c.id, (typeOf(c)==='trial' || c.last) ? remaining(c) : Infinity));
  const val = (c,d) => { const pr = priceAt(d); return !pr ? 0 : typeOf(c)==='trial' ? pr.single : pr.pack/PACK; };
  for(let d=t; d<=end; d=addDays(d,1)){
    slotsOn(d).sort((a,b) => a.time.localeCompare(b.time)).forEach(sl => {
      const off = !!offAt(sl,d);
      attendees(sl,d).forEach(a => {
        if(a.skipped) return;
        const c = db.clients.find(x => x.id===a.clientId);
        if(doneOf(c, sessKey(sl.id,a.clientId,d), d)) return;
        if(off){ offMissed.push({cid:c.id, date:d, value:val(c,d)}); return; }
        if(cap.get(c.id) <= 0) return;

const DURS = [[30,'30 perc'],[45,'45 perc'],[60,'1 óra'],[90,'1,5 óra'],[120,'2 óra']];
const endTime = s => { const [h,m] = s.time.split(':').map(Number); const t = h*60+m+(s.dur||60); return pad(Math.floor(t/60)%24)+':'+pad(t%60); };
const slotsSorted = () => [...db.slots].sort((a,b)=> a.dow-b.dow || a.time.localeCompare(b.time));
function fixMembers(slot, date){ return db.members.filter(m => m.slotId===slot.id && m.from<=date && (!m.to || date<=m.to)); }
function attendees(slot, date){
  const out = [];
  fixMembers(slot,date).forEach(m => {
    if(out.some(o => o.clientId===m.clientId)) return;
    const skipped = db.skips.some(k => k.slotId===slot.id && k.clientId===m.clientId && k.date===date);
    out.push({clientId:m.clientId, kind:'fix', memberId:m.id, skipped});
  });
  db.extras.filter(x => x.slotId===slot.id && x.date===date).forEach(x => {
    if(!out.some(o => o.clientId===x.clientId)) out.push({clientId:x.clientId, kind:'extra', extraId:x.id, skipped:false});
  });
  return out.filter(o => db.clients.some(c => c.id===o.clientId));
}
const occ = (slot,date) => attendees(slot,date).filter(a => !a.skipped).length;
const baseOcc = (slot,date) => fixMembers(slot,date).length;
const sessKey = (slotId,clientId,date) => slotId+'|'+clientId+'|'+date;
function doneOf(c, key, date){
  return c.sessions.find(s => s.ref===key && !s.lost) || c.sessions.find(s => s.date===date && !s.ref) || null;
}
function occPill(n){
  const cls = n>capN() ? 'low' : n===capN() ? 'full' : n===0 ? 'zero' : '';
  return `<span class="pill ${cls}">${n}/${capN()}</span>`;
}
function fixSlotsText(c){
  const t = today();
  const ms = db.members.filter(m => m.clientId===c.id && (!m.to || m.to>=t));
  const ss = ms.map(m => db.slots.find(s => s.id===m.slotId)).filter(Boolean)
    .sort((a,b)=> a.dow-b.dow || a.time.localeCompare(b.time));

/* ---------- fizetés ---------- */
const PAYM = {atutalas:'átutalás', keszpenz:'készpénz'};
/* bérletek fizetési állapota: archív (a naptár kezdőnapja előtt indult) bérletet nem követ */
function payPacks(c){
  if(typeOf(c)==='trial' || !db.calStart) return [];
  const size = sizeOf(c), cs = sorted(c).filter(x => !x.trial), n = cs.length, groups = [];
  for(let i=0;i<n;i+=size) groups.push(cs.slice(i,i+size));
  const lastIdx = c.last ? Math.floor(((c.lastEnd || size)-1)/size) : Infinity;
  const cur = (n>0 && n%size===0) ? n/size : Math.floor(n/size);
  const pays = c.pays || [], payOf = i => pays.find(p => p.pack===i) || null;
  const isArch = i => !!(groups[i] && groups[i][0].date < db.calStart);
  const top = Math.min(lastIdx, (payOf(cur) || isArch(cur)) ? cur+1 : cur), out = [];
  for(let i=0;i<=top;i++){
    const g = groups[i], pay = payOf(i);
    out.push({i, pay, state: pay ? 'paid' : isArch(i) ? 'arch' : g ? 'due' : i===cur ? (n===0 ? 'first' : 'next') : 'later'});
  }
  return out;
}
const trialUnpaid = c => !db.calStart ? [] : c.sessions.filter(x => !x.lost && (typeOf(c)==='trial' || x.trial) && !x.paid && x.date >= db.calStart);
function payDue(c){
  if(c.anon || !db.calStart) return null;
  const u = trialUnpaid(c); if(u.length) return {kind:'trial', n:u.length};
  const p = payPacks(c).find(x => !x.pay && x.state!=='later' && x.state!=='arch');
  return p ? {kind:'pack', pack:p.i, state:p.state} : null;
}
const PAYST = {due:'fizetésre vár', next:'fizetésre vár (új bérlet)', first:'fizetésre vár', later:'következő bérlet · nem esedékes'};
function payCard(c){
  if(c.anon || !db.calStart) return '';
  let h = '';
  const u = trialUnpaid(c).length;
  if(u) h += `<div class="warn paywarn">${u} kifizetetlen alkalom. Koppints az edzésre a fizetés rögzítéséhez.</div>`;
  const ps = payPacks(c);
  if(ps.length){
    const open = ps.find(p => !p.pay && p.state!=='later' && p.state!=='arch');
    const ar = ps.filter(p => p.state==='arch'), rest = ps.filter(p => p.state!=='arch');
    const arRow = ar.length ? `<div class="payrow"><b class="grow">${ar.length>1 ? `${ar[0].i+1}.–${ar[ar.length-1].i+1}.` : `${ar[0].i+1}.`} bérlet</b><span class="sub">✓ archív · rendezett</span></div>` : '';
    h += secCard('pay', 'Fizetés', open ? '<span class="pill pay" style="font-size:12px;padding:2px 9px">fizetésre vár</span>' : '', [...rest].reverse().map(p => {
      const lab = `<b class="grow">${p.i+1}. bérlet</b>`;
      if(p.pay) return `<button class="payrow" data-a="editpay" data-p="${p.i}">${lab}<span class="sub">✓ kifizetve · ${md(p.pay.date)} · ${PAYM[p.pay.method]}</span></button>`;
      return `<div class="payrow">${lab}<span class="pill ${p.state==='later' ? 'zero' : 'pay'}">${PAYST[p.state]}</span>${open && open.i===p.i ? `<button class="mini ok" data-a="newpay" data-p="${p.i}">Fizetés rögzítése</button>` : (p.state==='later' && !open ? `<button class="mini" data-a="newpay" data-p="${p.i}">Előre fizetés</button>` : '')}</div>`;
    }).join('') + arRow, true);
  }
  return h;
}
function payTag(c,s){
  if(!db.calStart || s.lost || !(typeOf(c)==='trial' || s.trial) || s.date < db.calStart) return '';
  return s.paid ? `<span class="sub">✓ fizetve</span>` : `<span class="pill pay" style="font-size:12px;padding:1px 8px">fizetésre vár</span>`;
}

/* ---------- várólista ---------- */
const slotLabel = sl => DOWS[sl.dow-1]+' '+sl.time;
function cleanWait(){
  db.wait = (db.wait||[]).filter(w => { const c = db.clients.find(x => x.id===w.clientId); return c && !c.anon; });
  const ok = id => db.slots.some(sl => sl.id===id);
  const ok2 = id => ok(id) && db.slots.some(sl => sl.id===id && (!sl.to || sl.to>=today()));
  db.wait.forEach(w => { w.fix = w.fix.filter(ok2); w.flex = w.flex.filter(ok2); });
  db.wait = db.wait.filter(w => w.fix.length || w.flex.length);
}
function waitFor(slot,date){
  if(date < today() || offAt(slot,date) || !live(slot,date) || (db.calStart && date < db.calStart) || occ(slot,date) >= capN()) return [];
  const at = attendees(slot,date);
  return db.wait.filter(w => (w.fix.includes(slot.id) || w.flex.includes(slot.id)) && !at.some(a => a.clientId===w.clientId))
    .sort((a,b) => a.ts.localeCompare(b.ts) || a.id.localeCompare(b.id));
}
function otherSameDay(sl,date,cid){
  return slotsOn(date).filter(x => x.id!==sl.id && attendees(x,date).some(a => a.clientId===cid && !a.skipped)).map(x => x.time).sort();
}
/* apply=false: csak ellenőriz ({err} vagy {warn}); apply=true: végrehajtja */
function placeOnce(sl,date,cid,apply){
  if(!live(sl,date)) return {err:'Ezen a napon ez az időpont nem létezik.'};
  if(db.calStart && date < db.calStart) return {err:`A naptár kezdőnapja ${md(db.calStart)}. Korábbi edzést a vendégadatlapon rögzíts (archív).`};
  const me = attendees(sl,date).find(a => a.clientId===cid);
  if(me) return {err: me.skipped ? `${cname(cid)} ezen az alkalmon már szerepel, de lemondta. Ha mégis jön, használd a „Mégis jön” gombot.` : `${cname(cid)} már be van írva erre az alkalomra.`};
  if(occ(sl,date) >= capN()) return {err:`Ez az alkalom tele van (${capN()}/${capN()}). Csak akkor rakható be valaki, ha előbb valaki lemondja (Lemondta: most), vagy másik napot választasz.`};
  if(!apply){ const o = otherSameDay(sl,date,cid); return o.length ? {warn:`${cname(cid)} aznap (${md(date)}) már be van írva ${o.join(', ')} órára. Mégis beteszed ide is?`} : null; }
  db.extras.push({id:uid(), slotId:sl.id, clientId:cid, date}); return null;
}
function placeFix(sl,date,cid,apply){
  if(db.calStart && date < db.calStart) return {err:`A naptár kezdőnapja ${md(db.calStart)}. Korábbi napra nem rakható be fix vendég.`};
  const mine = db.members.filter(m => m.slotId===sl.id && m.clientId===cid && (!m.to || m.to>=date));
  if(mine.some(m => m.from<=date)) return {err:`${cname(cid)} már fix vendég ezen az időponton.`};
  const inAt = d => attendees(sl,d).some(a => a.clientId===cid);
  for(let i=0;i<12;i++){
    const d = addDays(date, 7*i);
    if(sl.to && d > sl.to) break;
    if(!live(sl,d)) continue;
    if(!inAt(d) && occ(sl,d) >= capN()) return {err:`${md(d)} dátumon már tele van (${capN()}/${capN()}), így nem rakható be fixen. Szabadíts fel helyet, vagy add hozzá csak egyszeri vendégként.`};
  }
  if(!apply){
    const cl = [];
    for(let i=0;i<12;i++){ const d = addDays(date, 7*i), o = otherSameDay(sl,d,cid); if(o.length) cl.push(md(d)+' ('+o.join(', ')+')'); }
    return cl.length ? {warn:`${cname(cid)} ezeken a napokon egy másik időpontban is be van írva: ${cl.slice(0,6).join(', ')}${cl.length>6 ? ' …' : ''}. Mégis beteszed fixen?`} : null;
  }
  /* ahol már szerepel (egyszeri vagy későbbi fix), oda nem kerül be még egyszer */
  db.extras = db.extras.filter(x => !(x.slotId===sl.id && x.clientId===cid && x.date>=date));
  const later = mine.filter(m => m.from>date).sort((a,b) => a.from.localeCompare(b.from));
  if(later.length) later[0].from = date;
  else db.members.push({id:uid(), slotId:sl.id, clientId:cid, from:date, to:null});
  return null;
}
function tryPlace(kind, sl, date, cid, after){
  const f = kind==='fix' ? placeFix : placeOnce;
  const r = f(sl,date,cid,false);
  if(r && r.err) return note(r.err);
  const go = () => { const r2 = f(sl,date,cid,true); if(r2 && r2.err) return note(r2.err); save(); render(); if(after) after(); };
  if(r && r.warn) ask(r.warn, go); else go();
}

    if(trialOld.length){ const [hh,o] = grpHead('tr', !groups.length, '1 alkalom'); h += hh + (o ? [...trialOld].reverse().map(sessRow).join('') : ''); }
    app.innerHTML = h;

function renderCal(hd, app, fab){

  const wkSlots = db.slots.filter(s => wkDays.some(d => s.dow===dowOf(d) && live(s,d)));
  const times = [...new Set(wkSlots.map(s => s.time))].sort();
  const wkEnd = addDays(calWeek,6);

        const names = at.map(a => {
          const c = db.clients.find(x => x.id===a.clientId);

          if(a.skipped) nm = `<s>${nm}</s>`;

        }).join('');

  }
  app.innerHTML = h;

}

let wSel = null;   /* súlydiagramon kiválasztott pont */
function niceStep(rg){ for(const st of [0.5,1,2,5,10,20,50]) if(rg/st <= 5) return st; return 100; }
function weightChart(ss){
  const pts = ss.filter(s => s.weight!=null).map(s => ({d:s.date, w:s.weight}));
  if(pts.length < 2) return pts.length===1 ? secCard('w', 'Testsúly', `<b>${String(pts[0].w).replace('.',',')} kg</b>`, `<span class="sub">Egy mérés: ${md(pts[0].d)}</span>`, true) : '';
  const W=330, H=190, L=34, Rm=10, T=12, B=36, pw=W-L-Rm, ph=H-T-B;
  const ws = pts.map(x=>x.w), mn = Math.min(...ws), mx = Math.max(...ws);
  const st = niceStep(Math.max(mx-mn, 1)); let lo = Math.floor(mn/st)*st, hi = Math.ceil(mx/st)*st; if(hi===lo){ lo -= st; hi += st; }
  const ms = d => parse(d).getTime(), t0 = ms(pts[0].d), t1 = ms(pts[pts.length-1].d), tr = (t1-t0)||1;
  const X = d => L + (ms(d)-t0)/tr*pw, Y = w => T + (hi-w)/(hi-lo)*ph;
  const kg = v => (Math.round(v*10)/10).toString().replace('.',',');
  let g = '';
  for(let v=lo; v<=hi+1e-9; v+=st){ const y = Y(v).toFixed(1); g += `<line class="gl" x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}"/><text x="${L-5}" y="${(+y+3.5).toFixed(1)}" text-anchor="end">${kg(v)}</text>`; }
  g += `<line class="gl" x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}"/>`;
  /* évváltások */
  const y0 = +pts[0].d.slice(0,4), y1 = +pts[pts.length-1].d.slice(0,4), segs = [];
  for(let y=y0; y<=y1; y++){ const a = y===y0 ? L : X(y+'-01-01'), b = y===y1 ? W-Rm : X((y+1)+'-01-01'); segs.push({y,a,b}); if(y>y0) g += `<line class="yl" x1="${a.toFixed(1)}" x2="${a.toFixed(1)}" y1="${T}" y2="${T+ph+30}"/>`; }
  /* dátumfeliratok: csak annyi, amennyi kifér (min. 40 px) */
  const lab = []; pts.forEach((p,i) => { const x = X(p.d); if(!lab.length || x - X(pts[lab[lab.length-1]].d) >= 40) lab.push(i); });
  const li = pts.length-1; if(lab[lab.length-1]!==li){ if(X(pts[li].d) - X(pts[lab[lab.length-1]].d) < 40 && lab.length>1) lab.pop(); lab.push(li); }
  segs.forEach(sg => { if(sg.b - sg.a >= 26) g += `<text x="${((sg.a+sg.b)/2).toFixed(1)}" y="${T+ph+14}" text-anchor="middle" style="font-weight:700">${sg.y}</text>`; });
  lab.forEach(i => { const x = X(pts[i].d); g += `<text x="${x.toFixed(1)}" y="${T+ph+28}" text-anchor="${i===0?'start':i===li?'end':'middle'}">${pts[i].d.slice(5,7)}.${pts[i].d.slice(8,10)}</text>`; });
  const line = pts.map(x => X(x.d).toFixed(1)+','+Y(x.w).toFixed(1)).join(' ');
  const dots = pts.map((x,i) => `<circle cx="${X(x.d).toFixed(1)}" cy="${Y(x.w).toFixed(1)}" r="${wSel===i?5:3.5}" style="fill:var(--acc)"/>`).join('');
  const hits = pts.map((x,i) => `<circle class="hit" data-a="wpt" data-i="${i}" cx="${X(x.d).toFixed(1)}" cy="${Y(x.w).toFixed(1)}" r="12"/>`).join('');
  let tip = '';
  if(wSel!=null && pts[wSel]){
    const p = pts[wSel], txt = `${md(p.d)} · ${kg(p.w)} kg`, tw = txt.length*6.3+14, px = X(p.d), py = Y(p.w);
    const bx = Math.max(2, Math.min(W-tw-2, px-tw/2)), by = py-34 < 0 ? py+10 : py-34;
    tip = `<g class="tip" data-a="wpt" data-i="${wSel}"><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${tw.toFixed(1)}" height="24" rx="6"/><text x="${(bx+tw/2).toFixed(1)}" y="${(by+16).toFixed(1)}" text-anchor="middle">${txt}</text></g>`;
  }
  const f = pts[0].w, l = pts[pts.length-1].w, diff = Math.round((l-f)*10)/10;
  return secCard('w', 'Testsúly', `<b>${String(l).replace('.',',')} kg</b>`, `<div class="sub">${diff>0?'+':''}${String(diff).replace('.',',')} kg az első mérés óta · koppints egy pontra a részletekért</div>
    <svg class="wch" viewBox="0 0 ${W} ${H}">${g}<polyline points="${line}" fill="none" style="stroke:var(--acc)" stroke-width="2"/>${dots}${hits}${tip}</svg>`, true);
}

      <div class="hint" style="margin:0 0 6px">Ezeken a napokon (vagy órákban) nem lesz edzés. A foglalásokat az app nem törli, csak narancssárgán jelzi az érintett alkalmakat. A bérletből nem vonódik le alkalom, a tervezett bevételből kiesik.</div>
      <label>Kezdete</label>${dateField('f-from',ui.from)}
      <label>Vége (az utolsó nap is beleszámít)</label>${dateField('f-to',ui.to)}
      <label class="chk"><input type="checkbox" id="f-part" data-a="offpart" ${ui.part ? 'checked' : ''}><span>Nem egész nap</span></label>
      ${ui.part ? `<div class="row" style="margin-top:8px"><div class="grow"><label style="margin-top:0">Ettől</label><input type="time" id="f-t1" value="${esc(ui.t1||'')}"></div><div class="grow"><label style="margin-top:0">Eddig</label><input type="time" id="f-t2" value="${esc(ui.t2||'')}"></div></div><div class="hint">Minden kiválasztott napon csak az ebbe az idősávba eső időpontok maradnak el.</div>` : ''}
      <label>Megjegyzés</label><input id="f-note" value="${esc(ui.note)}" placeholder="pl. szabadság, beteg" autocomplete="off">
      ${af ? `<div class="card" style="margin-top:12px"><b>Érintett: ${af.bookings} foglalás</b>${af.names.length ? `<div class="sub" style="margin-top:4px">${af.names.map(esc).join(', ')}</div>` : ''}</div>` : ''}
      <div class="btns">${ui.id ? '<button class="del" data-a="deloff">Törlés</button>' : ''}<button data-a="close">Mégse</button><button class="ok" data-a="saveoff">Mentés</button></div></div></div>`;
  } else if(ui.type === 'newslot'){
    const rows = ui.rows.map((r,i) => `<div class="card">
      <div class="row"><input type="time" id="r-t-${i}" value="${r.time}" style="flex:1">
        <select id="r-d-${i}" style="flex:1">${DURS.map(d => `<option value="${d[0]}" ${r.dur===d[0]?'selected':''}>${d[1]}</option>`).join('')}</select>
        ${ui.rows.length>1 ? `<button class="mini" data-a="rrm" data-i="${i}">✕</button>` : ''}</div>
      <div class="chips" style="margin-top:10px;gap:6px">${DOWS.map((d,k) => `<button type="button" class="chip ${r.days.includes(k+1)?'on':''}" style="padding:8px 10px;font-size:14px" data-a="rday" data-i="${i}" data-k="${k+1}">${d}</button>`).join('')}</div>
      <div class="minis"><button class="mini" data-a="rpre" data-i="${i}" data-p="wd">H–P</button><button class="mini" data-a="rpre" data-i="${i}" data-p="all">Minden nap</button><button class="mini" data-a="rpre" data-i="${i}" data-p="none">Törlés</button></div></div>`).join('');
    m.innerHTML = `<div class="modal"><div class="sheet"><h2>Új időpontok</h2>
      <div class="hint" style="margin:0 0 10px">Soronként egy kezdési idő, időtartam, és azok a napok, amikor van ilyen időpont. Az üres sorokat kihagyja.</div>
      ${rows}
      <button class="mini" data-a="radd" style="width:100%;margin-top:4px">+ Újabb sor</button>
      <div class="btns"><button data-a="close">Mégse</button><button class="ok" data-a="saveslot">Mentés</button></div></div></div>`;
  } else if(ui.type === 'editslot'){
    const s = db.slots.find(x => x.id===ui.slotId);
    m.innerHTML = `<div class="modal"><div class="sheet"><h2>Időpont módosítása</h2>
      <div class="sub" style="margin:-6px 0 6px">${DOW[s.dow-1]} · érvényes ${md(ui.date)}-tól</div>
      <div class="row"><input type="time" id="e-t" value="${s.time}" style="flex:1"><select id="e-d" style="flex:1">${DURS.map(d => `<option value="${d[0]}" ${(s.dur||60)===d[0]?'selected':''}>${d[1]}</option>`).join('')}</select></div>
      <div class="hint">A módosítás ettől a naptól minden hétre érvényes. A korábbi napok (edzések, lemondások) változatlanok maradnak. A fix vendégek és a várólista átkerülnek.</div>
      <div class="btns"><button data-a="slot" data-s="${s.id}" data-d="${ui.date}">Mégse</button><button class="ok" data-a="saveeditslot">Mentés</button></div></div></div>`;
  } else if(ui.type === 'slot'){
    const slot = db.slots.find(s => s.id===ui.slotId);
    if(!slot){ ui=null; m.innerHTML=''; return; }
    if(ui.done){
      const d = ui.done, c = db.clients.find(x => x.id===d.cid);
      m.innerHTML = `<div class="modal"><div class="sheet"><h2>${d.edit ? 'Edzés részletei' : 'Mit edzettek?'}</h2>
        <div class="sub" style="margin:-6px 0 6px">${esc(c.name)} · ${md(ui.date)}</div>
        <label>Izomcsoport</label><div class="chips">${[...TAGS, ...d.tags.filter(t => !TAGS.includes(t))].map(t => `<button type="button" class="chip ${d.tags.includes(t)?'on':''} ${t==='egyéb'?'oth':''}" data-a="dtag" data-t="${t}">${t}</button>`).join('')}</div>
        ${d.tags.includes('egyéb') ? '<div class="hint oth">Egyéb esetén írd le a megjegyzésben, mi történt és miért.</div>' : ''}
        <label>Testsúly (kg, opcionális)</label><input id="d-w" inputmode="decimal" placeholder="pl. 91,5" value="${esc(d.weight)}">
        <label>Megjegyzés (opcionális)</label><input id="d-note" value="${esc(d.note)}" autocomplete="off">
        ${(typeOf(c)==='trial' || d.trial) ? `<label>Kifizette?</label><div class="chips">${[['','Még nem'],['atutalas','Átutalás'],['keszpenz','Készpénz']].map(([k,l]) => `<button type="button" class="chip ${(d.pay||'')===k?'on':''}" data-a="dpay" data-k="${k}">${l}</button>`).join('')}</div>` : ''}
        <div class="btns"><button data-a="dcancel">Mégse</button>${d.edit ? '' : '<button data-a="dskip">Részletek nélkül</button>'}<button class="ok" data-a="dsave">Mentés</button></div></div></div>`;
      return;
    }
    const date = ui.date, at = attendees(slot,date), n = at.filter(a=>!a.skipped).length;
    const rows = at.map(a => {
      const c = db.clients.find(x=>x.id===a.clientId);
      const key = sessKey(slot.id,c.id,date), ds = doneOf(c,key,date);
      let st = '', bt = '';
      if(ds){
        st = '<span class="pill">✓ megtartva</span>';
        bt = `<button class="mini" data-a="ddetail" data-c="${c.id}">Részletek</button>` + (ds.ref===key ? `<button class="mini" data-a="undone" data-c="${c.id}">Visszavonás</button>` : `<span class="sub">a vendégnél már rögzítve</span>`);
      } else if(a.skipped){
        const lost = c.sessions.some(x => x.ref===key && x.lost);
        st = lost ? '<span class="pill low">lemondta &lt;24 óra · elveszett</span>' : '<span class="pill low">lemondta</span>';
        bt = `<button class="mini" data-a="unskip" data-c="${c.id}">Mégis jön</button>`
           + (lost ? `<button class="mini" data-a="unlate" data-c="${c.id}">Nem késői (visszaadom)</button>` : `<button class="mini" data-a="late" data-c="${c.id}">Késői volt (levonom)</button>`)
           + `<button class="mini" data-a="endfix" data-c="${c.id}">Lemondás: végleg</button>`;
      } else if(a.kind==='fix'){
        bt = `${ui.date<=today() ? `<button class="mini ok" data-a="done" data-c="${c.id}">✓ Megtartva</button>` : ''}<button class="mini" data-a="skip" data-c="${c.id}">Lemondás: egyszeri</button><button class="mini" data-a="endfix" data-c="${c.id}">Lemondás: végleg</button>`;
      } else {
        st = '<span class="pill zero">egyszeri</span>';
        bt = `${ui.date<=today() ? `<button class="mini ok" data-a="done" data-c="${c.id}">✓ Megtartva</button>` : ''}<button class="mini" data-a="rmextra" data-c="${c.id}">Törlés</button>`;
      }
      const det = ds ? [(ds.tags||[]).join(', '), ds.weight!=null ? String(ds.weight).replace('.',',')+' kg' : '', ds.note].filter(Boolean).join(' · ') : '';
      const pd = payDue(c);
      return `<div class="card"><div class="row"><b class="grow">${esc(c.name)}</b>${pd ? '<span class="pill pay">fizetésre vár</span>' : ''}${st}</div>${det ? `<div class="sub" style="margin-top:4px">${esc(det)}</div>` : ''}<div class="minis">${bt}</div></div>`;
    }).join('');
    const cand = activeClients().filter(c => !at.some(a => a.clientId===c.id)).sort((a,b)=>a.name.localeCompare(b.name,'hu'));
    const addBox = !activeClients().length ? `<div class="hint">Előbb vegyél fel vendéget a Vendégek fülön.</div>`
      : !cand.length ? `<div class="hint">Minden vendég szerepel már ezen az alkalmon.</div>`
      : `<label>Vendég hozzáadása</label>
         <select id="f-cl">${cand.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
         <div class="minis"><button class="mini ok" data-a="addone">Csak ezen a napon</button><button class="mini" data-a="addfix">Fix, hetente ettől a naptól</button></div>
         ${n>=capN() ? `<div class="hint">Ez az alkalom most tele van (${n}/${capN()}).</div>`:''}`;
    const wl = waitFor(slot,date);
    const waitBox = wl.length ? `<div class="grp">Várólista (${wl.length})</div>` + wl.map(w => {
      const c = db.clients.find(x => x.id===w.clientId), fx = w.fix.includes(slot.id);
      return `<div class="card"><div class="row"><b class="grow">${esc(c.name)}</b><span class="pill zero">${fx ? 'fix helyet kér' : 'beugró'}</span></div>
        <div class="sub">${c.phone ? telLink(c) : 'nincs telefonszám'}</div>${w.note ? `<div class="sub">${esc(w.note)}</div>` : ''}
        <div class="minis"><button class="mini ok" data-a="wonce" data-w="${w.id}">Beteszem erre az alkalomra</button>${fx ? `<button class="mini" data-a="wfixin" data-w="${w.id}">Beteszem fixen</button>` : ''}</div></div>`;
    }).join('') : '';
    m.innerHTML = `<div class="modal"><div class="sheet">
      <div class="row"><h2 class="grow">${DOW[slot.dow-1]} ${md(date)} · ${slot.time}–${endTime(slot)}</h2>${baseOcc(slot,date)!==n ? `<span class="sub">alap ${baseOcc(slot,date)}/${capN()}</span>` : ''}${occPill(n)}</div>
      ${offAt(slot,date) ? `<div class="warn offw">Ez az alkalom elmarad: ${esc(offAt(slot,date).note || 'szabadság / betegség')}${offAt(slot,date).t1 ? ' ('+offAt(slot,date).t1+'–'+offAt(slot,date).t2+')' : ''}</div>` : ''}
      ${rows || '<div class="empty" style="padding:16px">Üres időpont.</div>'}
      ${waitBox}
      ${addBox}
      <div class="btns"><button class="del" data-a="delslot">Időpont törlése</button>${date>=today() ? '<button data-a="editslot">Módosítás</button>' : ''}<button class="ok" data-a="close">Bezárás</button></div>
    </div></div>`;
  }
}

function readOffForm(){
  const g = id => document.getElementById(id);
  if(g('f-from')) ui.from = g('f-from').value; if(g('f-to')) ui.to = g('f-to').value; if(g('f-note')) ui.note = g('f-note').value;
  if(g('f-t1')) ui.t1 = g('f-t1').value; if(g('f-t2')) ui.t2 = g('f-t2').value;
}
function readRows(){
  ui.rows.forEach((r,i) => {
    const t = document.getElementById('r-t-'+i), d = document.getElementById('r-d-'+i);
    if(t) r.time = t.value;
    if(d) r.dur = +d.value;
  });
}
function readSessForm(){
  ui.s.date = document.getElementById('f-date').value || today();
  ui.s.note = document.getElementById('f-note').value.trim();
  const w = document.getElementById('f-w').value.trim().replace(',','.');
  ui.s.weight = w==='' ? null : (isFinite(parseFloat(w)) ? Math.round(parseFloat(w)*10)/10 : null);
}

function removeClientData(id){
  db.members = db.members.filter(x => x.clientId!==id);
  db.skips = db.skips.filter(x => x.clientId!==id);
  db.extras = db.extras.filter(x => x.clientId!==id);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(wSel!=null && (!b || b.dataset.a!=='wpt')){ wSel = null; if(!b){ render(); return; } }
  if(!b) return;
  const a = b.dataset.a, id = b.dataset.id, cid = b.dataset.c;
  if(a==='dlgyes'){ const f = dlg && dlg.yes; const late = dlg && dlg.check ? !!document.getElementById('dlg-chk').checked : undefined; dlg = null; showDlg(); if(f) f(late); return; }
  if(a==='dlgno'){ dlg = null; showDlg(); return; }
  if(a==='dlgopt'){ const o = dlg && dlg.opts && dlg.opts[+b.dataset.i]; dlg = null; showDlg(); if(o && o.f) o.f(); return; }
  if(a==='pickdate'){ const h = document.getElementById(b.dataset.for); const v = (h && h.value) || today(); dp = {for:b.dataset.for, ym:v.slice(0,7), sel:h && h.value, max:b.dataset.max || ''}; renderDp(); return; }
  if(a==='dpnav'){ dp.ym = addMonths(dp.ym, +b.dataset.n); renderDp(); return; }
  if(a==='dppick'){ setDate(dp.for, b.dataset.d); dp = null; renderDp(); return; }
  if(a==='dptoday'){ setDate(dp.for, today()); dp = null; renderDp(); return; }
  if(a==='dpclose'){ dp = null; renderDp(); return; }
  const cur = () => db.clients.find(x => x.id === view);
  const slot = () => ui && db.slots.find(s => s.id===ui.slotId);

  if(a==='tab'){ tab=b.dataset.t; ui=null; render(); window.scrollTo(0,0); }
  else if(a==='settings'){ view='settings'; render(); window.scrollTo(0,0); }
  else if(a==='back'){ view='list'; openSec={}; render(); window.scrollTo(0,0); }
  else if(a==='open'){ view=id; openSec={}; wSel=null; render(); window.scrollTo(0,0); }
  else if(a==='wpt'){ const i = +b.dataset.i; wSel = wSel===i ? null : i; render(); }
  else if(a==='sec'){ const k = b.dataset.k; openSec[k] = !secOpen(k, b.dataset.def==='1'); render(); }
  else if(a==='newclient'){ ui={type:'client',name:'',phone:'',ctype:'pack',last:false,strength:null}; render(); }
  else if(a==='editclient'){ const c=db.clients.find(x=>x.id===id); ui={type:'client',id,name:c.name,phone:c.phone||'',ctype:typeOf(c),last:!!c.last,strength:c.strength||null}; render(); }
  else if(a==='str'){ readClientForm(); const v=+b.dataset.v; ui.strength = ui.strength===v ? null : v; renderModal(); }
  else if(a==='sort'){
    const k = b.dataset.k;
    if(db.sort && db.sort.by===k) db.sort.dir = db.sort.dir==='asc' ? 'desc' : 'asc';
    else db.sort = {by:k, dir: k==='name' ? 'asc' : 'desc'};
    save(); render();
  }
  else if(a==='ctype'){
    readClientForm(); const t=b.dataset.t;
    if(t!==ui.ctype) ui.ctype = t;
    renderModal();
  }
  else if(a==='saveclient'){
    readClientForm();
    const n = ui.name.trim(); if(!n) return;
    const c = ui.id ? db.clients.find(x=>x.id===ui.id) : {id:uid(), name:n, sessions:[]};
    c.name = n; c.type = ui.ctype;
    const phn = (ui.phone||'').replace(/[^\d+\-()\/. ]/g,'').trim().slice(0,30); if(phn) c.phone = phn; else delete c.phone;
    if(ui.ctype==='trial' || c.size===1) delete c.size;
    if(ui.ctype==='pack' && ui.last){
      if(!c.last){ const sz = sizeOf(c); c.lastEnd = (Math.floor(usedSessions(c).length/sz)+1)*sz; }
      c.last = true;
    } else { delete c.last; delete c.lastEnd; }
    if(ui.strength) c.strength = ui.strength; else delete c.strength;
    if(!ui.id) db.clients.push(c);
    save(); ui=null; render();
  }
  else if(a==='delclient'){
    const c = db.clients.find(x=>x.id===ui.id);
    const keep = c.sessions.length || (c.pays||[]).length;
    ask(keep ? `Törlöd: ${c.name}? A név, telefonszám, súly, megjegyzések és a beosztás törlődik. Az edzések és a fizetések névtelenül megmaradnak, hogy a bevétel ne változzon.` : `Törlöd: ${c.name}?`, () => {
      removeClientData(c.id); db.wait = (db.wait||[]).filter(w => w.clientId!==c.id);
      if(!keep) db.clients = db.clients.filter(x => x.id!==c.id);
      else { c.name = 'Törölt vendég'; delete c.phone; delete c.strength; c.anon = true; c.sessions.forEach(x => { x.weight = null; x.note = ''; x.tags = []; }); }
      save(); ui=null; view='list'; render();
    });
  }
  else if(a==='newsess'){ ui={type:'sess',s:{date:archMax(),tags:[],weight:null,note:''}}; render(); }
  else if(a==='editsess'){ const s = cur().sessions.find(x=>x.id===id); ui={type:'sess',id,s:{...s,tags:[...(s.tags||[])]}}; render(); }
  else if(a==='spay'){ readSessForm(); const k = b.dataset.k; if(k) ui.s.paid = {date: (ui.s.paid && ui.s.paid.date) || today(), method:k}; else delete ui.s.paid; renderModal(); }
  else if(a==='tag'){ readSessForm(); const t=b.dataset.t, i=ui.s.tags.indexOf(t); i>=0?ui.s.tags.splice(i,1):ui.s.tags.push(t); renderModal(); }
  else if(a==='savesess'){
    readSessForm(); const c = cur();
    const orig = ui.id && c.sessions.find(x => x.id===ui.id);
    if(!ui.s.ref && ui.s.date > archMax() && !(orig && orig.date===ui.s.date)) return note(`Kézzel legkésőbb ${md(archMax())} dátumú edzést rögzíthetsz. Ennél újabb alkalmat a Naptárban rögzíts.`);
    if(orig && orig.ref) ui.s.date = orig.date;
    if(ui.id){ const i = c.sessions.findIndex(x=>x.id===ui.id); c.sessions[i] = {...ui.s, id:ui.id}; }
    else c.sessions.push({...ui.s, id:uid(), ...(typeOf(c)==='trial' ? {trial:true} : {})});
    save(); ui=null; render();
  }
  else if(a==='delsess'){ const sid = ui.id; ask('Törlöd ezt az edzést?', () => { const c=cur(); c.sessions=c.sessions.filter(x=>x.id!==sid); save(); ui=null; render(); }); }
  else if(a==='close'){ ui=null; render(); }
  else if(a==='export'){ exportFile(); }
  else if(a==='wipe'){ ask('Biztosan törlöd az ÖSSZES adatot (vendégek, naptár, árak, szabadság)?', () => ask('Utolsó megerősítés: a törlés nem vonható vissza. Készítettél mentést?', () => { const cfg = db.cfg; db = normalize({clients:[], lastExport:null, cfg}); save(); view='list'; tab='clients'; render(); })); }

  /* naptár */
  else if(a==='wk'){ const n=+b.dataset.n; calWeek = n===0 ? mondayOf(today()) : addDays(calWeek||mondayOf(today()), 7*n); render(); window.scrollTo(0,0); }
  else if(a==='newslot'){ ui={type:'newslot',rows:[0,1,2,3].map(() => ({time:'',dur:60,days:[]}))}; render(); }
  else if(a==='radd'){ readRows(); ui.rows.push({time:'',dur:60,days:[]}); renderModal(); }
  else if(a==='rrm'){ readRows(); ui.rows.splice(+b.dataset.i,1); renderModal(); }
  else if(a==='rday'){ readRows(); const r=ui.rows[+b.dataset.i], k=+b.dataset.k, j=r.days.indexOf(k); if(j>=0) r.days.splice(j,1); else r.days.push(k); renderModal(); }
  else if(a==='rpre'){ readRows(); const r=ui.rows[+b.dataset.i], pr=b.dataset.p; r.days = pr==='wd' ? [1,2,3,4,5] : pr==='all' ? [1,2,3,4,5,6,7] : []; renderModal(); }
  else if(a==='saveslot'){
    readRows();
    const filled = ui.rows.filter(r => r.time || r.days.length);
    if(filled.some(r => !r.time || !r.days.length)) return note('Van olyan sor, ahol hiányzik a kezdési idő vagy a nap. Töltsd ki, vagy töröld a sort.');
    if(!filled.length) return note('Adj meg legalább egy kezdési időt és egy napot.');
    let add = 0, skip = 0;
    filled.forEach(r => r.days.forEach(dow => {
      if(db.slots.some(s => s.dow===dow && s.time===r.time && (!s.to || s.to>=today()))) skip++;
      else { db.slots.push({id:uid(), dow, time:r.time, dur:r.dur, ...(db.calStart && db.calStart<today() ? {from:today()} : {})}); add++; }
    }));
    if(add && !db.calStart) db.calStart = today();
    save(); ui=null; render();
    if(skip) note(`${add} új időpont felvéve, ${skip} már létezett, azt kihagytam.`);
  }
  else if(a==='rm'){
    const cur = today().slice(0,7), n = +b.dataset.n, nx = addMonths(cur,1);
    const earliest = db.clients.flatMap(c => c.sessions.map(x => x.date.slice(0,7))).concat([cur]).sort()[0];
    revMonth = n===0 ? cur : addMonths(revMonth||cur, n);
    if(revMonth > nx) revMonth = nx;
    if(revMonth < earliest) revMonth = earliest;
    render(); window.scrollTo(0,0);
  }
  else if(a==='editprice'){
    const p = db.prices.length ? (priceAt(today()) || db.prices[0]) : null;
    ui = {type:'price', first:!db.prices.length, pack:p?String(p.pack):'', single:p?String(p.single):'', from:today()}; render();
  }
  else if(a==='saveprice'){
    const pack = parseMoney(document.getElementById('p-pack').value), single = parseMoney(document.getElementById('p-single').value);
    if(pack===null || single===null) return note('Adj meg mindkét árat számokkal (Ft).');
    let from = '1970-01-01';
    if(!ui.first){
      from = document.getElementById('p-from').value || today();
      /* a már rögzített edzések értékét befagyasztjuk a régi árral */
      db.clients.forEach(c => { const vals = sessionValues(c); c.sessions.forEach(x => { if(x.val===undefined && vals.has(x.id)) x.val = vals.get(x.id); }); });
    }
    db.prices = db.prices.filter(p => p.from!==from);
    db.prices.push({from, pack, single});
    db.prices.sort((x,y) => x.from.localeCompare(y.from));
    save(); ui=null; render();
  }
  else if(a==='newoff'){ ui={type:'off', from:today(), to:today(), note:'', part:false, t1:'', t2:''}; render(); }
  else if(a==='editoff'){ const o=db.offs.find(x=>x.id===id); ui={type:'off', id, from:o.from, to:o.to, note:o.note||'', part:!!o.t1, t1:o.t1||'', t2:o.t2||''}; render(); }
  else if(a==='offpart'){ readOffForm(); ui.part = !!b.checked; renderModal(); }
  else if(a==='saveoff'){
    readOffForm(); const {from, to} = ui, nt = ui.note.trim();
    if(!from || !to) return note('Add meg a kezdő és a záró dátumot.');
    if(to < from) return note('A vége nem lehet korábbi, mint a kezdete.');
    if(ui.part && (!ui.t1 || !ui.t2 || ui.t1 >= ui.t2)) return note('Add meg az idősávot: a kezdete legyen korábbi, mint a vége.');
    const tt = ui.part ? {t1:ui.t1, t2:ui.t2} : {};
    if(ui.id){ const o = db.offs.find(x=>x.id===ui.id); o.from=from; o.to=to; o.note=nt; delete o.t1; delete o.t2; Object.assign(o, tt); }
    else db.offs.push({id:uid(), from, to, note:nt, ...tt});
    save(); ui=null; render();
    ask('Szabadság mentve. Készítesz most biztonsági mentést?', () => exportFile());
  }
  else if(a==='deloff'){
    const oid = ui.id;
    ask('Törlöd ezt a szabadság / betegség bejegyzést? A foglalásokhoz nem nyúl, csak a jelölés tűnik el, és az alkalmak újra megtartottnak jelölhetők.', () => { db.offs = db.offs.filter(x=>x.id!==oid); save(); ui=null; render(); });
  }
  else if(a==='slot'){ ui={type:'slot', slotId:b.dataset.s, date:b.dataset.d}; render(); }
  else if(a==='calinfo'){ info(legendHtml()); }
  else if(a==='payfilter'){ payOnly = !payOnly; render(); }
  else if(a==='newpay'){ ui={type:'pay', cid:view, pack:+b.dataset.p, date:today(), method:null}; render(); }
  else if(a==='editpay'){ const c=cur(), pay=(c.pays||[]).find(x=>x.pack===+b.dataset.p); if(!pay) return; ui={type:'pay', cid:c.id, pack:pay.pack, id:pay.id, date:pay.date, method:pay.method}; render(); }
  else if(a==='paym'){ readPayForm(); ui.method = b.dataset.k; renderModal(); }
  else if(a==='savepay'){
    readPayForm();
    if(!ui.method) return note('Válaszd ki, hogyan fizetett.');
    if(ui.date > today()) return note('A fizetés dátuma nem lehet jövőbeli.');
    const c = db.clients.find(x=>x.id===ui.cid); c.pays = c.pays || [];
    c.pays = c.pays.filter(x => x.pack!==ui.pack && x.id!==ui.id);
    c.pays.push({id:ui.id || uid(), pack:ui.pack, date:ui.date, method:ui.method});
    save(); ui=null; render();
  }
  else if(a==='delpay'){ const pid = ui.id, cid2 = ui.cid; ask('Visszavonod ezt a fizetést?', () => { const c = db.clients.find(x=>x.id===cid2); c.pays = (c.pays||[]).filter(x=>x.id!==pid); save(); ui=null; render(); }); }
  else if(a==='newwait'){
    const cands = activeClients().filter(c => !db.wait.some(x => x.clientId===c.id)).sort((a,b) => a.name.localeCompare(b.name,'hu'));
    if(!cands.length) return note('Minden vendég már a várólistán van, vagy még nincs vendég. Új vendéget a Vendégek fülön vehetsz fel.');
    ui={type:'wait', w:{clientId:cands[0].id, fix:[], flex:[], note:''}}; render();
  }
  else if(a==='editwait'){ const w = db.wait.find(x=>x.id===id); if(!w) return; ui={type:'wait', id, w:{clientId:w.clientId, fix:[...w.fix], flex:[...w.flex], note:w.note||''}}; render(); }
  else if(a==='wfix' || a==='wflex'){
    readWaitForm(); const sid = b.dataset.s, w = ui.w, me = a==='wfix' ? 'fix' : 'flex', other = a==='wfix' ? 'flex' : 'fix';
    const i = w[me].indexOf(sid); if(i>=0) w[me].splice(i,1); else { w[me].push(sid); w[other] = w[other].filter(x => x!==sid); }
    renderModal();
  }
  else if(a==='savewait'){
    readWaitForm(); const w = ui.w;
    if(!db.clients.some(c => c.id===w.clientId)) return;
    const taken = id => db.members.some(m => m.clientId===w.clientId && m.slotId===id && (!m.to || m.to>=today()));
    const drop = [...w.fix, ...w.flex].filter(taken);
    w.fix = w.fix.filter(x => !taken(x)); w.flex = w.flex.filter(x => !taken(x));
    if(!w.fix.length && !w.flex.length) return note(drop.length ? 'A megjelölt időpontokban a vendég már fix vendég. Jelölj meg másik időpontot.' : 'Jelölj meg legalább egy időpontot.');
    const old = ui.id && db.wait.find(x => x.id===ui.id);
    const entry = {id: ui.id || uid(), clientId:w.clientId, fix:w.fix, flex:w.flex, note:w.note.trim(), ts: old ? old.ts : today()};
    if(old) Object.assign(old, entry); else db.wait.push(entry);
    save(); ui=null; render();
    if(drop.length) note('Néhány időpontot kihagytam, mert a vendég ott már fix vendég.');
  }
  else if(a==='delwait'){ const w = db.wait.find(x=>x.id===id); if(!w) return; ask(`Törlöd ${cname(w.clientId)} várólistás bejegyzését?`, () => { db.wait = db.wait.filter(x=>x.id!==id); save(); render(); }); }
  else if(a==='wonce' || a==='wfixin'){
    const w = db.wait.find(x=>x.id===b.dataset.w), s = slot(); if(!w || !s) return;
    const wid = w.id, nm = cname(w.clientId), fix = a==='wfixin';
    const drop = () => { db.wait = db.wait.filter(x => x.id!==wid); save(); render(); };
    tryPlace(fix ? 'fix' : 'once', s, ui.date, w.clientId, () => {
      const e = db.wait.find(x => x.id===wid); if(!e) return;
      const others = [...e.fix, ...e.flex].filter(x => x!==s.id).length;
      const only = {label:'Csak ezt az időpontot veszem le', f:() => { e.fix = e.fix.filter(x => x!==s.id); e.flex = e.flex.filter(x => x!==s.id); save(); render(); }};
      if(!fix) return choose(`${nm} bekerült erre az alkalomra (${md(ui.date)}). Mi legyen a várólistás bejegyzésével?`, others
        ? [{label:'Marad a várólistán', ok:true}, only, {label:'A teljes bejegyzést törlöm', f:drop}]
        : [{label:'Marad a várólistán', ok:true}, {label:'Kiveszem a várólistáról', f:drop}]);
      if(!others){ drop(); return note(`${nm} fixen bekerült (${slotLabel(s)}), és kikerült a várólistáról, mert ez volt az egyetlen kért időpontja.`); }
      choose(`${nm} fixen bekerült: ${slotLabel(s)}. Mi legyen a várólistás bejegyzésével?`, [{...only, ok:true}, {label:'A teljes bejegyzést törlöm', f:drop}]);
    });
  }
  else if(a==='delslot'){
    const s = slot(); if(!s) return;
    const date = ui.date, lab = `${DOW[s.dow-1]} ${s.time}–${endTime(s)}`, hasPast = slotHasData(s, date);
    const onlyThis = () => {
      if(hasPast){
        if(!offAt(s,date)) db.offs.push({id:uid(), from:date, to:date, t1:s.time, t2:endTime(s), note:'elmarad'});
        save(); render();
        note(`A ${md(date)} ${s.time} alkalom elmarad. A Szabadság / betegség sávban látszik, onnan visszavonható. A bérletből nem vonódik le, a tervezett bevételből kiesik.`);
      } else {
        s.no = [...new Set([...(s.no||[]), date])];
        db.extras = db.extras.filter(x => !(x.slotId===s.id && x.date===date));
        db.skips = db.skips.filter(x => !(x.slotId===s.id && x.date===date));
        save(); ui=null; render();
      }
    };
    const fromHere = () => {
      if(db.clients.some(c => c.sessions.some(x => x.ref && x.ref.startsWith(s.id+'|') && x.date>=date && !x.lost)))
        return note(`Ezen a napon vagy később már van megtartottnak jelölt edzés ezen az időponton. Előbb vond vissza, vagy a következő naptól töröld.`);
      if(!hasPast){
        db.slots = db.slots.filter(x=>x.id!==s.id);
        db.members = db.members.filter(x=>x.slotId!==s.id);
        db.skips = db.skips.filter(x=>x.slotId!==s.id);
        db.extras = db.extras.filter(x=>x.slotId!==s.id);
      } else {
        const prev = addDays(date,-1);
        s.to = prev; if(s.no){ s.no = s.no.filter(d => d<=prev); if(!s.no.length) delete s.no; }
        db.members = db.members.filter(m => !(m.slotId===s.id && m.from>=date));
        db.members.forEach(m => { if(m.slotId===s.id && (!m.to || m.to>prev)) m.to = prev; });
        db.skips = db.skips.filter(x => !(x.slotId===s.id && x.date>=date));
        db.extras = db.extras.filter(x => !(x.slotId===s.id && x.date>=date));
        db.clients.forEach(c => { c.sessions = c.sessions.filter(x => !(x.ref && x.ref.startsWith(s.id+'|') && x.date>=date && x.lost)); });
      }
      save(); ui=null; render();
    };
    if(date < today()) return choose(`${lab}, ${md(date)}. Múltbeli napon csak ez az egy alkalom vonható vissza; a korábbi adatok zároltak.`, [{label:'Csak ezt az alkalmat', ok:true, f:onlyThis}, {label:'Mégse'}]);
    choose(`${lab} törlése. Csak ezt az alkalmat (${md(date)}), vagy ettől a naptól az összeset, a foglalásokkal együtt? A korábbi napok és edzések megmaradnak.`,
      [{label:'Csak ezt az alkalmat', f:onlyThis}, {label:'Ettől a naptól az összeset', cls:'del', f:() => ask(`Biztosan törlöd ${md(date)}-tól az összes ${lab} alkalmat, a fix vendégekkel és foglalásokkal együtt?`, fromHere)}, {label:'Mégse', ok:true}]);
  }
  else if(a==='editslot'){ const s = slot(); if(!s) return; ui = {type:'editslot', slotId:s.id, date:ui.date, time:s.time, dur:s.dur||60}; render(); }
  else if(a==='saveeditslot'){
    const s = db.slots.find(x => x.id===ui.slotId); if(!s) return;
    const time = document.getElementById('e-t').value, dur = +document.getElementById('e-d').value, D = ui.date;
    if(!/^\d{2}:\d{2}$/.test(time)) return note('Adj meg kezdési időt.');
    if(time===s.time && dur===(s.dur||60)){ ui = {type:'slot', slotId:s.id, date:D}; return render(); }
    if(time!==s.time && db.slots.some(x => x.id!==s.id && x.dow===s.dow && x.time===time && (!x.to || x.to>=D)))
      return note(`${DOW[s.dow-1]} ${time} időpont már létezik.`);
    if(!slotHasData(s, D)){ s.time = time; s.dur = dur; save(); ui = {type:'slot', slotId:s.id, date:D}; return render(); }
    /* zárolás: a régi időpont D előtti napon lezárul, D-től új indul, a fix vendégek, foglalások, várólista átkerülnek */
    const ns = {id:uid(), dow:s.dow, time, dur, from:D, ...(s.to ? {to:s.to} : {})}, prev = addDays(D,-1);
    if(s.no){ const keep = s.no.filter(d => d<D), mv = s.no.filter(d => d>=D); if(keep.length) s.no = keep; else delete s.no; if(mv.length) ns.no = mv; }
    s.to = prev; db.slots.push(ns);
    db.members.filter(m => m.slotId===s.id && (!m.to || m.to>=D)).forEach(m => {
      if(m.from>=D) m.slotId = ns.id;
      else { db.members.push({id:uid(), slotId:ns.id, clientId:m.clientId, from:D, to:m.to||null}); m.to = prev; }
    });
    [db.skips, db.extras].forEach(arr => arr.forEach(x => { if(x.slotId===s.id && x.date>=D) x.slotId = ns.id; }));
    db.clients.forEach(c => c.sessions.forEach(x => { if(x.ref && x.ref.startsWith(s.id+'|') && x.date>=D) x.ref = ns.id+'|'+c.id+'|'+x.date; }));
    (db.wait||[]).forEach(w => { w.fix = w.fix.map(x => x===s.id ? ns.id : x); w.flex = w.flex.map(x => x===s.id ? ns.id : x); });
    save(); ui = {type:'slot', slotId:ns.id, date:D}; render();
    note(`Módosítva ${md(D)}-tól: ${time}–${endTime(ns)}. A korábbi napok változatlanok maradtak.`);
  }
  else if(a==='done' && ui && ui.date > today()){ note('Jövőbeli alkalmat nem lehet megtartottnak jelölni.'); }
  else if(a==='done'){ ui.done = {cid, tags:[], weight:'', note:''}; render(); }
  else if(a==='ddetail'){
    const s = slot(), c = db.clients.find(x=>x.id===cid), ds = doneOf(c, sessKey(s.id,cid,ui.date), ui.date);
    if(!ds) return;
    ui.done = {cid, edit:ds.id, tags:[...(ds.tags||[])], weight: ds.weight!=null ? String(ds.weight).replace('.',',') : '', note: ds.note||'', pay: ds.paid ? ds.paid.method : '', trial: !!ds.trial}; render();
  }
  else if(a==='dtag'){ readDoneForm(); const t=b.dataset.t, i=ui.done.tags.indexOf(t); if(i>=0) ui.done.tags.splice(i,1); else ui.done.tags.push(t); renderModal(); }
  else if(a==='dpay'){ readDoneForm(); ui.done.pay = b.dataset.k; renderModal(); }
  else if(a==='dcancel'){ ui.done = null; render(); }
  else if(a==='dsave' || a==='dskip'){
    if(a==='dsave') readDoneForm();
    const d = ui.done, s = slot(), c = db.clients.find(x=>x.id===d.cid);
    const det = a==='dsave' ? {tags:[...d.tags], weight:parseW(d.weight), note:d.note.trim()} : {tags:[], weight:null, note:''};
    if(d.edit){ const x = c.sessions.find(y => y.id===d.edit); if(x){ Object.assign(x, det); if(a==='dsave' && (typeOf(c)==='trial' || x.trial)){ if(d.pay){ if(!x.paid || x.paid.method!==d.pay) x.paid = {date:today(), method:d.pay}; } else delete x.paid; } } }
    else {
      const key = sessKey(s.id,d.cid,ui.date);
      if(!doneOf(c,key,ui.date)) c.sessions.push({id:uid(), date:ui.date, ...det, ref:key, ...(typeOf(c)==='trial' ? {trial:true} : {}), ...(a==='dsave' && d.pay && typeOf(c)==='trial' ? {paid:{date:ui.date, method:d.pay}} : {})});
    }
    ui.done = null; save(); render();
  }
  else if(a==='undone'){
    const s = slot(), c = db.clients.find(x=>x.id===cid), key = sessKey(s.id,cid,ui.date);
    c.sessions = c.sessions.filter(x => x.ref!==key); save(); render();
  }
  else if(a==='skip'){
    const s = slot(), date = ui.date;
    ask(`${cname(cid)} lemondja az alkalmat (${md(date)}). Egyszeri lemondás, a fix hely megmarad.`, late => {
      if(!db.skips.some(k=>k.slotId===s.id && k.clientId===cid && k.date===date)) db.skips.push({slotId:s.id, clientId:cid, date});
      if(late) addLost(s.id, cid, date);
      save(); render();
    }, 'Lemondás 24 órán belül: az alkalom elveszik (levonódik)');
  }
  else if(a==='unskip'){
    const s = slot(), key = sessKey(s.id,cid,ui.date), c = db.clients.find(x=>x.id===cid);
    db.skips = db.skips.filter(k => !(k.slotId===s.id && k.clientId===cid && k.date===ui.date));
    c.sessions = c.sessions.filter(x => !(x.ref===key && x.lost));
    save(); render();
  }
  else if(a==='late'){ addLost(slot().id, cid, ui.date); save(); render(); }
  else if(a==='unlate'){
    const key = sessKey(slot().id,cid,ui.date), c = db.clients.find(x=>x.id===cid);
    c.sessions = c.sessions.filter(x => !(x.ref===key && x.lost)); save(); render();
  }
  else if(a==='endfix'){
    const s = slot(), date = ui.date;
    const m = db.members.find(x => x.slotId===s.id && x.clientId===cid && x.from<=date && (!x.to || date<=x.to));
    if(!m) return;
    const wasSkipped = db.skips.some(k => k.slotId===s.id && k.clientId===cid && k.date===date);
    ask(`${cname(cid)} véglegesen kikerül a fix időpontból, ettől a naptól: ${md(date)}. Az eddigi alkalmak megmaradnak.`, late => {
      const prev = addDays(date,-1);
      if(late && !wasSkipped) addLost(s.id, cid, date);
      if(prev < m.from) db.members = db.members.filter(x => x.id!==m.id); else m.to = prev;
      db.skips = db.skips.filter(k => !(k.slotId===s.id && k.clientId===cid && k.date>=date));
      save(); render();
    }, wasSkipped ? null : 'A mostani alkalmat 24 órán belül mondta le: elveszik (levonódik)');
  }
  else if(a==='rmextra'){
    const s = slot();
    db.extras = db.extras.filter(x => !(x.slotId===s.id && x.clientId===cid && x.date===ui.date)); save(); render();
  }
  else if(a==='addone' || a==='addfix'){
    const s = slot(), c = document.getElementById('f-cl').value; if(!s || !c) return;
    tryPlace(a==='addfix' ? 'fix' : 'once', s, ui.date, c);
  }
});

async function exportFile(raw){
  const now = Date.now(), d = today(), t = new Date(), stamp = d+' '+pad(t.getHours())+'-'+pad(t.getMinutes());
  const snap = Object.assign({}, db, {lastExport: now, bkSess: sessTotal()});
  const name = 'MRKteam app '+stamp+(raw ? ' frissítés előtt' : '')+'.json';
  const body = typeof raw==='string' ? raw : JSON.stringify(snap,null,1);
  const blob = new Blob([body], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  const done = () => { db.lastExport = now; db.bkSess = snap.bkSess; try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} render(); };
  const download = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 20000);
    done(); note('A mentésfájl letöltődött a telefonra (Letöltések mappa, „'+name+'"). Onnan küldd el vagy másold biztonságos helyre (Drive, e-mail).');
  };
  let canShare = false;
  try{ canShare = !!(navigator.canShare && navigator.share && navigator.canShare({files:[file]})); }catch(e){}
  if(canShare){
    try{ await navigator.share({files:[file], title:'MRKteam app biztonsági mentés '+stamp, text:'MRKteam app biztonsági mentés '+stamp}); done(); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* megszakítva: nem számít mentésnek */ }
  }
  try{ download(); }catch(e){ note('A mentés nem sikerült: '+(e && e.message || e)); }
}
function importFile(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || typeof d!=='object' || !Array.isArray(d.clients)) throw 0;
      ask(`Visszatöltés: ${d.clients.length} vendég. Felülírja a jelenlegi adatokat. Folytatod?`, () => {
        db = normalize(d); db.lastExport = db.lastExport || Date.now(); db.bkSess = sessTotal(); save(); view='list'; tab='clients'; render();
      });
    }catch(e){ note('Ez nem érvényes mentésfájl.'); }
  };
  r.readAsText(f);
}

if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
render();
if(updRaw && db.clients.length) ask(`Az app frissült (verzió ${VERSION}). Mented a frissítés előtti adatokat egy fájlba? Ha a frissítéssel gond lenne, ebből visszaállítható.`, () => exportFile(updRaw));
else checkBackup();
</script>
